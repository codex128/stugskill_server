<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Recursive:wght@300..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
        <title>stugskill</title>
    </head>
    <body>
        <h1 class="logo">Stug <span>Leaderboard</span></h1>
        <p class="intro">Player data is collected when people play <a href="https://stug.io">stug.io</a> while using the <a href="https://addons.mozilla.org/en-US/firefox/addon/stugskill/">stugskill Firefox addon</a>. Help the project by downloading the extension!</p>
        <div class="controls">
            <select id="mode-filter">
                <option value="conquest">Conquest</option>
                <option value="battle">Battle</option>
                <option value="1v1">1v1</option>
            </select>
            <input id="name-filter" class="filter-text-input" type="text" value="" placeholder="filter by name">
            <input id="lobby-filter" class="filter-text-input" type="text" value="" placeholder="filter by lobby">
            <select id="max-players">
                <option value="50">Top 50</option>
                <option value="100">Top 100</option>
                <option value="500">Top 500</option>
                <option value="0">All</option>
            </select>
            <button id="fetch-players">Fetch</button>
            <span id="active-games"></span>
        </div>
        <div class="board">
            <table id="player-table"></table>
        </div>
        <script src="index.js" type="text/javascript"></script>
    </body>
</html>
