<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Stug Skill</title>
    </head>
    <body>
        <h1>Stug Leaderboard</h1>
        <p>Player data is collected when people play <a href="https://stug.io">stug.io</a> while using the <a href="https://addons.mozilla.org/en-US/firefox/addon/stugskill/">stugskill firefox addon</a>. Help the project by downloading the extension!</p>
        <select id="mode-filter">
            <option value="conquest">Conquest</option>
            <option value="battle">Battle</option>
        </select>
        <input id="name-filter" type="text" value="" placeholder="filter by name">
        <select id="max-players">
            <option value="50">Top 50</option>
            <option value="100">Top 100</option>
            <option value="500">Top 500</option>
            <option value="0">All</option>
        </select>
        <button id="fetch-players">Fetch</button>
        <table id="player-table"></table>
        <script src="index.js" type="text/javascript"></script>
    </body>
</html>
